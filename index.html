<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricker Game</title>
</head>
<link rel="stylesheet" href="Cricket.css">
<body>
   <h1>Bat Ball Stump Game</h1> 
   <button class="Choice-buton"  onclick="
      let computerChoice = generateComputerChoice();
      let resultMsg = getResult('Bat',computerChoice);
      showResult('Bat',computerChoice,resultMsg);
      "><img src="2 Images/bat.jpeg" alt="" class="Choice-image" ></button>

   <button class="Choice-buton"  onclick="
      computerChoice = generateComputerChoice();
      resultMsg = getResult('Ball',computerChoice);
      showResult('Ball',computerChoice,resultMsg);
      "><img src="2 Images/ball.jpeg" alt="" class="Choice-image" ></button>
   
   <button class="Choice-buton"  onclick="
      computerChoice = generateComputerChoice();
      resultMsg = getResult('stump',computerChoice);
      showResult('stump',computerChoice,resultMsg);
      "><img src="2 Images/stump.jpeg" alt="" class="Choice-image" ></button>

      <h3 id="user-move"></h3>
      <h3 id="computer-move"></h3>
      <h3 id="result"></h3>
      <h3 id="score"></h3>

      <button  onclick="localStorage.clear()
      resetScore();
      " class="reset-choice">Reset</button>


   <script>
    let scoreStr = localStorage.getItem('score');
    let score;
    resetScore(scoreStr);
    
      function resetScore(scoreStr) {
        score = scoreStr ? JSON.parse(scoreStr) : {
        win:0,
        lost:0,
        tie:0,
       };

       score.displayScore = function (){
          return ` Score: Won:${score.win},Lost:${score.lost},Tie:${score.tie}`;
        };

        showResult();

       }

    function generateComputerChoice(){
        //This will generate random number between 0 & 3.
      let randomNumber =Math.random() * 3;
      if (randomNumber > 0 && randomNumber <= 1)
      {
      return 'Bat';
      // console.log('computer choice is bat');
      } 
      else if (randomNumber > 1 && randomNumber <= 2)
      {
        return'Ball';
      // console.log('computer choice is Ball');
      } else {
        return 'stump';
      // console.log('computer choice is stump');
      } 
      return computerChoice;
      } 


      function getResult(userMove,computerMove){
      if (userMove === 'Bat'){
        if (computerMove==='Ball'){
          score.win++;
          return'user won' 
        }else if (computerMove==='Bat'){
          score.tie++;
          return`it's a tie` 
        } else{ score.lost++;
          return'computer won' 
        } 
        }
      else if (userMove === 'Ball'){
        if (computerMove ==='Ball'){
          score.tie++;
          return`it's a tie` 
        }else if (computerMove ==='Bat'){
          score.lost++;
          return 'computer won'
        } else{ score.win++;
          return' user won' 
        } 
        }
      else {
        if (computerMove ==='Ball'){
          score.lost++;
          return'computer won'
        }else if (computerMove ==='Bat'){
          score.win++;
          return'user won'
        } else{
          score.tie++;
          return`it's a tie` 
        } 
        }
      }


      function showResult(userMove,computerMove,result){
        localStorage.setItem('score',JSON.stringify(score));

        document.querySelector('#user-move').innerText = 
          userMove !== undefined ? `you have chosen ${userMove}` : '';

        document.querySelector('#computer-move').innerText = 
          computerMove !== undefined ?`computer choice is ${computerMove} `: '';

        document.querySelector('#result').innerText = 
           result || '';

        document.querySelector('#score').innerText = score.displayScore();

      }
   </script>
</body>
</html>
